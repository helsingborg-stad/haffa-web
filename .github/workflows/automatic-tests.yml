name: Automatic Tests
on:
  pull_request:

  workflow_dispatch:

jobs:
  tests:
    name: Run Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm ci

      - name: run tests
        run: npm test -- --coverage

      - name: Save output
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage
